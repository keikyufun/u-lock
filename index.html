<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Piano</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#05070f;color:#e8f6ff;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#status{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:rgba(5,10,25,.7);font-size:13px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#start{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:rgba(5,7,15,.88);text-align:center;padding:24px}
#start h1{margin:0;font-size:28px;letter-spacing:.04em}
#start p{margin:0;max-width:420px;line-height:1.7;font-size:14px;color:#a9c4d6}
button{font:inherit;color:#e8f6ff;background:rgba(0,229,255,.16);border:1px solid rgba(0,229,255,.7);border-radius:10px;padding:8px 14px;cursor:pointer}
button:active{background:rgba(0,229,255,.4)}
#big{font-size:17px;padding:12px 28px}
#panel{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);background:rgba(5,10,25,.72);backdrop-filter:blur(6px);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center;font-size:12px}
#panel.hide .ctl{display:none}
label{display:flex;align-items:center;gap:6px}
input[type=range]{width:90px}
.lv{display:none}
body.live .lv{display:flex}
body.live .st{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="status"></div>
<div id="start">
  <h1>AR Piano</h1>
  <p>机にカメラを向けると、ピアノが机の上に固定されます。スマホを動かすと、実物のように見る角度が変わります。鍵盤に指を置くと音が鳴ります（タッチ・クリック・PCキーボードでもOK）。スタンドに立てて使うのがおすすめ。</p>
  <button id="big">カメラで始める</button>
  <button id="nocam">カメラなしで始める</button>
</div>
<div id="panel">
  <button id="gear">⚙ 設定</button>
  <button class="ctl lv" id="place">床をタップして置く</button>
  <button class="ctl lv" id="floor">床を認識</button>
  <button class="ctl" id="cal">キャリブレーション</button>
  <button class="ctl" id="mir">左右反転</button>
  <label class="ctl st">縦位置<input type="range" id="sy" min="10" max="80" value="45"></label>
  <label class="ctl st">遠近<input type="range" id="sp" min="30" max="100" value="70"></label>
  <label class="ctl lv">カメラ高さ<input type="range" id="sh" min="20" max="180" value="60"></label>
  <label class="ctl lv">向き<input type="range" id="sr" min="-180" max="180" value="0"></label>
  <label class="ctl lv">視野<input type="range" id="sf" min="40" max="90" value="65"></label>
  <label class="ctl">大きさ<input type="range" id="sw" min="40" max="100" value="90"></label>
  <label class="ctl">奥行き<input type="range" id="sd" min="15" max="60" value="35"></label>
  <label class="ctl">感度<input type="range" id="ss" min="1" max="9" value="5"></label>
</div>
<video id="vid" playsinline muted style="display:none"></video>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const vid=document.getElementById('vid'),stat=document.getElementById('status');
const sm=document.createElement('canvas'),sctx=sm.getContext('2d',{willReadFrequently:true});
const $=id=>document.getElementById(id);
let W=0,H=0,camOn=false,mirror=false,audio=null;
let gyro=false,R=null,placed=null,lastR=null,Rcal=null,still=0,stale=false;
let P={y:.45,w:.9,d:.35,p:.7,s:5,h:.6,fv:65,r:0};
let tips=[],skin=null,camPitch=0,placing=false,up=null,rawR=null,accSign=1,useAcc=false,scan=0,scanN=0,scanDot=0,scanZ=0,fmsg='';
let base=null,cur=null,calState='none',calT=0,calN=0,calAcc=null,SW=160,SH=90;

// keys
const NW=14,off=[0,2,4,5,7,9,11],keys=[];
for(let i=0;i<NW;i++){
  const m=60+Math.floor(i/7)*12+off[i%7],w=1/NW;
  keys.push({midi:m,black:false,i,u0:i/NW,u1:(i+1)/NW,s:[i/NW+w*.2,(i+1)/NW-w*.2,.68,.95],
    name:['C','D','E','F','G','A','B'][i%7]+(4+Math.floor(i/7)),src:{}});
}
for(let i=0;i<NW-1;i++){
  if(![0,1,3,4,5].includes(i%7))continue;
  const c=(i+1)/NW,bw=.6/NW;
  keys.push({midi:keys[i].midi+1,black:true,wi:i,u0:c-bw/2,u1:c+bw/2,s:[c-bw*.35,c+bw*.35,.12,.48],src:{}});
}
const whites=keys.filter(k=>!k.black),blacks=keys.filter(k=>k.black);

// audio
const active=new Map();
function ensureAudio(){
  if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state!=='running')audio.resume();
}
function noteOn(k){
  if(!audio||active.has(k.midi))return;
  const t=audio.currentTime,f=440*Math.pow(2,(k.midi-69)/12);
  const g=audio.createGain();g.connect(audio.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32,t+.008);
  g.gain.exponentialRampToValueAtTime(.001,t+3);
  const oscs=[['triangle',1,.7],['sine',2,.25],['sine',3,.1]].map(([ty,mul,a])=>{
    const o=audio.createOscillator(),og=audio.createGain();
    o.type=ty;o.frequency.value=f*mul;og.gain.value=a;
    o.connect(og);og.connect(g);o.start(t);return o;
  });
  active.set(k.midi,{g,oscs});
}
function noteOff(k){
  const a=active.get(k.midi);if(!a)return;
  const t=audio.currentTime;
  a.g.gain.cancelScheduledValues(t);
  a.g.gain.setValueAtTime(Math.max(a.g.gain.value,.001),t);
  a.g.gain.exponentialRampToValueAtTime(.0005,t+.3);
  a.oscs.forEach(o=>o.stop(t+.35));
  active.delete(k.midi);
}
function setSrc(k,name,on){
  k.src[name]=on;
  const any=Object.values(k.src).some(Boolean);
  if(any!==!!k.on){k.on=any;any?noteOn(k):noteOff(k);}
}
function releaseCam(){tips=[];for(const k of keys)if(k.src.cam)setSrc(k,'cam',false);}

// orientation
function rotM(a,b,g){
  const d=Math.PI/180;a*=d;b*=d;g*=d;
  const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);
  return [ca*cg-sa*sb*sg,-cb*sa,cg*sa*sb+ca*sg, cg*sa+ca*sb*sg,ca*cb,sa*sg-ca*cg*sb, -cb*sg,sb,cb*cg];
}
addEventListener('deviceorientation',e=>{
  if(e.alpha==null||e.beta==null)return;
  const r0=rotM(e.alpha,e.beta,e.gamma);rawR=r0;
  const r=useAcc&&up?fixR(r0):r0;
  R=R?R.map((v,i)=>v+(r[i]-v)*.6):r;
  if(!gyro){gyro=true;document.body.classList.add('live');}
});
const orA=()=>((screen.orientation?screen.orientation.angle:window.orientation)||0)*Math.PI/180;
const PSI=()=>placed.psi+P.r*Math.PI/180,WM=()=>P.w/.9*.5;
// gravity
addEventListener('devicemotion',e=>{
  const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
  const g=Math.hypot(a.x,a.y,a.z)||1,v=[a.x/g,a.y/g,a.z/g];
  up=up?up.map((x,i)=>x+(v[i]-x)*.15):v;
});
function fixR(r){
  const u=up.map(x=>x*accSign);
  let n=[r[3],r[4],r[5]];
  const d=n[0]*u[0]+n[1]*u[1]+n[2]*u[2];n=n.map((x,i)=>x-d*u[i]);
  const l=Math.hypot(n[0],n[1],n[2]);if(l<.1)return r;
  n=n.map(x=>x/l);
  const e=[n[1]*u[2]-n[2]*u[1],n[2]*u[0]-n[0]*u[2],n[0]*u[1]-n[1]*u[0]];
  return [e[0],e[1],e[2],n[0],n[1],n[2],u[0],u[1],u[2]];
}
function scanStep(){
  if(!scan)return;
  if(!up||!rawR){fmsg='加速度センサーなし：向きセンサーを使用';scan=0;stat.textContent=fmsg;return;}
  scanN++;scanDot+=up[0]*rawR[6]+up[1]*rawR[7]+up[2]*rawR[8];scanZ+=up[2];
  const left=Math.ceil((scan-performance.now())/1000);
  if(left>0){stat.textContent='カメラを床に向けて、ゆっくり傾けてね… '+left;return;}
  const m=scanDot/scanN;
  if(Math.abs(m)>.9){accSign=m>0?1:-1;useAcc=false;fmsg='床OK（センサー一致）';}
  else{accSign=scanZ>=0?1:-1;useAcc=true;fmsg='加速度で床を補正';}
  scan=0;stat.textContent=fmsg;
}
// floor grid
function toCam(x,y,z){
  const dx=R[0]*x+R[3]*y+R[6]*z,dy=R[1]*x+R[4]*y+R[7]*z,dz=R[2]*x+R[5]*y+R[8]*z;
  const th=orA(),c=Math.cos(th),s=Math.sin(th);
  return [dx*c-dy*s,dx*s+dy*c,-dz];
}
function seg(a,b){
  let p=toCam(a[0],a[1],a[2]),q=toCam(b[0],b[1],b[2]);const n=.05;
  if(p[2]<n&&q[2]<n)return;
  if(p[2]<n){const t=(n-p[2])/(q[2]-p[2]);p=p.map((v,i)=>v+(q[i]-v)*t);}
  else if(q[2]<n){const t=(n-q[2])/(p[2]-q[2]);q=q.map((v,i)=>v+(p[i]-v)*t);}
  const F=FL();
  ctx.moveTo(W/2+F*p[0]/p[2],H/2-F*p[1]/p[2]);ctx.lineTo(W/2+F*q[0]/q[2],H/2-F*q[1]/q[2]);
}
function drawGrid(){
  const n=12,s=.25;
  ctx.shadowBlur=0;ctx.lineWidth=1;
  for(let pass=0;pass<2;pass++){
    ctx.beginPath();
    for(let i=-n;i<=n;i++){
      if((i%4===0)!==(pass===1))continue;
      seg([i*s,-n*s,-P.h],[i*s,n*s,-P.h]);
      seg([-n*s,i*s,-P.h],[n*s,i*s,-P.h]);
    }
    ctx.strokeStyle=pass?'rgba(0,229,255,.7)':'rgba(0,229,255,.28)';ctx.stroke();
  }
}
const FL=()=>Math.max(W,H)/2/Math.tan(P.fv*Math.PI/360);
const live=()=>gyro&&placed&&R;
function ray(x,y){
  const F=FL(),rx=(x-W/2)/F,uy=-(y-H/2)/F,th=orA(),c=Math.cos(th),s=Math.sin(th);
  const dx=rx*c+uy*s,dy=-rx*s+uy*c,dz=-1;
  return [R[0]*dx+R[1]*dy+R[2]*dz,R[3]*dx+R[4]*dy+R[5]*dz,R[6]*dx+R[7]*dy+R[8]*dz];
}
function place(x=W/2,y=H/2,loud){
  if(!R)return false;
  const r=ray(x,y);
  if(r[2]>-.05){if(loud)stat.textContent='そこは床じゃなさそう。もっと下をタップしてね';return false;}
  const t=-P.h/r[2],fx=-R[2],fy=-R[5];
  placed={x:t*r[0],y:t*r[1],psi:Math.hypot(fx,fy)<.2?Math.atan2(R[1],R[4]):Math.atan2(fx,fy)};
  return true;
}

// projection
function w2s(x,y,z){
  const dx=R[0]*x+R[3]*y+R[6]*z,dy=R[1]*x+R[4]*y+R[7]*z,dz=R[2]*x+R[5]*y+R[8]*z;
  const f=-dz;if(f<.03)return null;
  const th=orA(),c=Math.cos(th),s=Math.sin(th),F=FL();
  return [W/2+F*(dx*c-dy*s)/f,H/2-F*(dx*s+dy*c)/f];
}
function P2S(u,v,l=0){
  if(live()){
    const Wm=WM(),Dm=Wm*P.d,ps=PSI(),sn=Math.sin(ps),cs=Math.cos(ps);
    const a=(u-.5)*Wm,b=(.5-v)*Dm;
    return w2s(placed.x+a*cs+b*sn,placed.y-a*sn+b*cs,-P.h+l);
  }
  const cx=W/2,yT=H*P.y,dh=H*P.d,pw=W*P.w,s=P.p+(1-P.p)*v;
  return [cx+(u-.5)*pw*s,yT+v*dh];
}
function toUV(x,y){
  if(live()){
    const [ex,ey,ez]=ray(x,y);
    if(ez>=-1e-3)return null;
    const t=-P.h/ez,ddx=t*ex-placed.x,ddy=t*ey-placed.y,ps=PSI();
    const sn=Math.sin(ps),cs=Math.cos(ps),Wm=WM();
    return [(ddx*cs-ddy*sn)/Wm+.5,.5-(ddx*sn+ddy*cs)/(Wm*P.d)];
  }
  const v=(y-H*P.y)/(H*P.d),s=P.p+(1-P.p)*v;
  return [(x-W/2)/(W*P.w*s)+.5,v];
}
function hit(x,y){
  const q=toUV(x,y);if(!q)return null;
  const [u,v]=q;if(v<0||v>1||u<0||u>1)return null;
  if(v<.6)for(const k of blacks)if(u>=k.u0&&u<=k.u1)return k;
  return whites[Math.min(NW-1,Math.floor(u*NW))];
}

// video
function drawCover(c,w,h){
  if(!camOn||!vid.videoWidth)return false;
  const sc=Math.max(w/vid.videoWidth,h/vid.videoHeight),dw=vid.videoWidth*sc,dh=vid.videoHeight*sc;
  c.save();if(mirror){c.translate(w,0);c.scale(-1,1);}
  c.drawImage(vid,(w-dw)/2,(h-dh)/2,dw,dh);c.restore();return true;
}
function grab(){
  if(!drawCover(sctx,SW,SH))return false;
  const d=sctx.getImageData(0,0,SW,SH).data;
  if(!cur||cur.length!==SW*SH)cur=new Float32Array(SW*SH);
  if(!skin||skin.length!==SW*SH)skin=new Uint8Array(SW*SH);
  for(let i=0,j=0;i<d.length;i+=4,j++){
    const r=d[i],g=d[i+1],b=d[i+2],y=r*.3+g*.59+b*.11;
    cur[j]=y;
    const cb=128-.1687*r-.3313*g+.5*b,cr=128+.5*r-.4187*g-.0813*b;
    skin[j]=(y>40&&cb>77&&cb<127&&cr>133&&cr<173)?1:0;
  }
  return true;
}

// calibration
function startCal(){if(!camOn)return;releaseCam();base=null;calState='count';calT=performance.now()+3000;}
function stepCal(){
  if(calState==='count'){
    const r=Math.ceil((calT-performance.now())/1000);
    if(r>0){stat.textContent='手を画面の外へ… '+r;return;}
    calState='grab';calN=0;calAcc=new Float32Array(SW*SH);
  }
  if(calState==='grab'){
    for(let i=0;i<calAcc.length;i++)calAcc[i]+=cur[i];
    if(++calN>=8){
      for(let i=0;i<calAcc.length;i++)calAcc[i]/=calN;
      base=calAcc;calState='done';Rcal=R?R.slice():null;stale=false;
    }
    stat.textContent='読み取り中…';
  }
}

// detect
let lab=null,que=null;
function detect(){
  const N=SW*SH;
  if(!lab||lab.length!==N){lab=new Uint8Array(N);que=new Int32Array(N);}
  let gs=0;for(let i=0;i<N;i++)gs+=cur[i]-base[i];gs/=N;
  const thr=(75-P.s*7)*.5;
  for(let i=0;i<N;i++)lab[i]=skin[i]&&Math.abs(cur[i]-base[i]-gs)>thr?1:0;
  tips=[];
  const minA=Math.max(8,N*.0008),kx=W/SW,ky=H/SH;
  for(let s=0;s<N;s++){
    if(lab[s]!==1)continue;
    let qh=0,qt=0,sx=0,sy=0;que[qt++]=s;lab[s]=2;
    while(qh<qt){
      const p=que[qh++],x=p%SW,y=(p/SW)|0;sx+=x;sy+=y;
      if(x>0&&lab[p-1]===1){lab[p-1]=2;que[qt++]=p-1;}
      if(x<SW-1&&lab[p+1]===1){lab[p+1]=2;que[qt++]=p+1;}
      if(y>0&&lab[p-SW]===1){lab[p-SW]=2;que[qt++]=p-SW;}
      if(y<SH-1&&lab[p+SW]===1){lab[p+SW]=2;que[qt++]=p+SW;}
    }
    if(qt<minA)continue;
    const cx=sx/qt,cy=sy/qt,req=Math.sqrt(qt/Math.PI),bd=new Float32Array(24),bi=new Int32Array(24).fill(-1);
    let mx=0;
    for(let n=0;n<qt;n++){
      const p=que[n],x=p%SW,y=(p/SW)|0;
      if(x<2||y<2||x>SW-3||y>SH-3)continue;
      const d=Math.hypot(x-cx,y-cy),b=Math.min(23,Math.floor((Math.atan2(y-cy,x-cx)+Math.PI)/(2*Math.PI)*24));
      if(d>bd[b]){bd[b]=d;bi[b]=p;}
      if(d>mx)mx=d;
    }
    for(let b=0;b<24;b++){
      if(bi[b]<0||bd[b]<req*1.35||bd[b]<mx*.6)continue;
      if(bd[b]<bd[(b+23)%24]||bd[b]<bd[(b+1)%24])continue;
      const p=bi[b];tips.push([(p%SW+.5)*kx,(((p/SW)|0)+.5)*ky]);
    }
  }
  const down=new Set();
  for(const t of tips){const k=hit(t[0],t[1]);if(k)down.add(k);}
  for(const k of keys){
    if(down.has(k)){k.miss=0;setSrc(k,'cam',true);}
    else if(k.src.cam&&++k.miss>2)setSrc(k,'cam',false);
  }
}

// draw
function path(p){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();}
function qd(u0,u1,v0,v1,l=0){
  const p=[P2S(u0,v0,l),P2S(u1,v0,l),P2S(u1,v1,l),P2S(u0,v1,l)];
  return p.some(x=>!x)?null:p;
}
function drawPiano(){
  ctx.lineWidth=1.5;
  let q=qd(-.03,1.03,-.12,1.12);
  if(q){
    path(q);ctx.shadowBlur=0;ctx.fillStyle='rgba(0,229,255,.08)';
    ctx.strokeStyle='rgba(0,229,255,.5)';ctx.setLineDash([6,5]);ctx.fill();ctx.stroke();ctx.setLineDash([]);
  }
  for(const k of whites){
    q=qd(k.u0+.002,k.u1-.002,0,1);if(!q)continue;
    path(q);
    ctx.fillStyle=k.on?'rgba(0,229,255,.6)':'rgba(255,255,255,.3)';
    ctx.strokeStyle='rgba(255,255,255,.8)';
    ctx.shadowColor='#00e5ff';ctx.shadowBlur=k.on?28:6;ctx.fill();ctx.stroke();
  }
  const L=live()?WM()*P.d*.1:0;
  for(const k of blacks){
    if(L){
      const f=[P2S(k.u0,.6,0),P2S(k.u1,.6,0),P2S(k.u1,.6,L),P2S(k.u0,.6,L)];
      if(!f.some(x=>!x)){path(f);ctx.shadowBlur=0;ctx.fillStyle='rgba(0,40,60,.75)';ctx.fill();}
    }
    q=qd(k.u0,k.u1,0,.6,L);if(!q)continue;
    path(q);
    ctx.fillStyle=k.on?'rgba(255,64,160,.85)':'rgba(10,14,30,.7)';
    ctx.strokeStyle='rgba(0,229,255,.9)';
    ctx.shadowColor=k.on?'#ff40a0':'#00e5ff';ctx.shadowBlur=k.on?28:8;ctx.fill();ctx.stroke();
  }
  ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.85)';ctx.textAlign='center';
  for(const k of whites){
    if(k.i%7)continue;
    const a=P2S(k.u0,.88),b=P2S(k.u1,.88),c=P2S((k.u0+k.u1)/2,.88);
    if(!a||!b||!c)continue;
    ctx.font=Math.max(9,Math.hypot(a[0]-b[0],a[1]-b[1])*.35)+'px system-ui';
    ctx.fillText(k.name,c[0],c[1]);
  }
}
function frame(){
  ctx.clearRect(0,0,W,H);
  const ok=drawCover(ctx,W,H);
  if(!ok){
    const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0a1230');gr.addColorStop(1,'#05070f');
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  }
  if(gyro&&R){
    if(!placed)place();
    camPitch=Math.round(Math.asin(Math.max(-1,Math.min(1,-R[8])))*180/Math.PI);
    scanStep();
    if(lastR){let d=0;for(let i=0;i<9;i++)d+=(R[i]-lastR[i])**2;still=d<2e-6?still+1:0;}
    lastR=R.slice();
    if(Rcal&&calState==='done'){let d=0;for(let i=0;i<9;i++)d+=(R[i]-Rcal[i])**2;if(Math.sqrt(d)>.04)stale=true;}
  }
  if(ok&&grab()){
    if(calState==='count'||calState==='grab')stepCal();
    else if(stale){
      releaseCam();stat.textContent='動かしたので検出を再調整…（じっとしてね）';
      if(still>45)startCal();
    }else if(base&&base.length===cur.length){
      detect();if(!scan&&!placing)stat.textContent='指先で弾いてね'+(gyro?'｜'+fmsg+'｜角度 '+camPitch+'°':'');
    }else stat.textContent='「キャリブレーション」を押してね';
  }
  if(gyro&&R)drawGrid();
  drawPiano();
  ctx.shadowBlur=0;ctx.fillStyle='#ffe14d';
  for(const t of tips){ctx.beginPath();ctx.arc(t[0],t[1],6,0,7);ctx.fill();}
  requestAnimationFrame(frame);
}

// events
function resize(){
  const d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  SW=160;SH=Math.max(30,Math.round(160*H/W));sm.width=SW;sm.height=SH;
  if(base&&base.length!==SW*SH){base=null;calState='none';}
}
addEventListener('resize',resize);
const ptrs=new Map();
cv.addEventListener('pointerdown',e=>{
  ensureAudio();
  if(placing){if(place(e.clientX,e.clientY,true)){placing=false;stat.textContent='置いたよ';}return;}
  const k=hit(e.clientX,e.clientY);
  if(k){ptrs.set(e.pointerId,k);setSrc(k,'p'+e.pointerId,true);cv.setPointerCapture(e.pointerId);}
});
function pup(e){const k=ptrs.get(e.pointerId);if(k){setSrc(k,'p'+e.pointerId,false);ptrs.delete(e.pointerId);}}
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
const kbW='asdfghjkl;',kbB={w:0,e:1,t:3,y:4,u:5,o:7,p:8};
function kbKey(e){
  const c=e.key.toLowerCase(),i=kbW.indexOf(c);
  if(i>=0)return whites[i];
  if(c in kbB)return blacks.find(k=>k.wi===kbB[c]);
}
addEventListener('keydown',e=>{if(e.repeat)return;const k=kbKey(e);if(k){ensureAudio();setSrc(k,'kb',true);}});
addEventListener('keyup',e=>{const k=kbKey(e);if(k)setSrc(k,'kb',false);});

async function askMotion(){
  try{
    if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')
      await DeviceOrientationEvent.requestPermission();
    if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function')
      await DeviceMotionEvent.requestPermission();
  }catch(e){}
}
async function startCam(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
    vid.srcObject=s;await vid.play();camOn=true;
    mirror=s.getVideoTracks()[0].getSettings().facingMode==='user';
    setTimeout(startCal,800);
  }catch(err){stat.textContent='カメラ不可（'+(err&&err.name||'unknown')+'）：タッチ／クリック／キーボードで弾けるよ';}
}
$('big').onclick=async()=>{ensureAudio();await askMotion();$('start').remove();startCam();};
$('nocam').onclick=async()=>{ensureAudio();await askMotion();$('start').remove();stat.textContent='タッチ／クリック／キーボード（A S D F…）で演奏';};
$('cal').onclick=startCal;
$('place').onclick=()=>{placing=true;stat.textContent='床の置きたい場所をタップしてね';};
$('mir').onclick=()=>{mirror=!mirror;startCal();};
$('gear').onclick=()=>$('panel').classList.toggle('hide');
[['sy','y',100],['sw','w',100],['sd','d',100],['sp','p',100],['ss','s',1],['sh','h',100],['sf','fv',1],['sr','r',1]].forEach(([id,key,div])=>{
  $(id).oninput=e=>{P[key]=+e.target.value/div;};
});
$('floor').onclick=()=>{scan=performance.now()+3000;scanN=0;scanDot=0;scanZ=0;};
resize();frame();
</script>
</body>
